[project]
name = "bi-data-compare"
version = "1.0.0"
description = "SQL Server Data Comparison & Compression Tool"
requires-python = ">=3.9"

[tool.black]
line-length = 88
target-version = ['py39', 'py310', 'py311']
include = '\.pyi?$'
exclude = '''
/(
    \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
  | venv
)/
'''

[tool.isort]
profile = "black"
line_length = 88
known_first_party = ["src"]
skip = [".venv", "venv", ".git", "__pycache__"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
exclude = [
    "venv",
    ".venv",
    "tests",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --cov=src --cov-report=term-missing"
markers = [
    "unit: marks tests as unit tests",
    "integration: marks tests as integration tests",
]

[tool.coverage.run]
source = ["src"]
omit = ["tests/*", "venv/*", ".venv/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]

# ===========================================
# SECURITY CONFIGURATION
# ===========================================

[tool.bandit]
# Security linter configuration
exclude_dirs = ["tests", "venv", ".venv"]
skips = [
    # B101: Use of assert detected - OK in tests
    "B101",
]
# Severity levels to report: LOW, MEDIUM, HIGH
severity = "MEDIUM"

[tool.bandit.assert_used]
skips = ["*_test.py", "test_*.py", "conftest.py"]

# SQL injection detection
[tool.bandit.hardcoded_sql_expressions]
# Report any SQL-like strings with string formatting
severity = "HIGH"

# Hardcoded password detection
[tool.bandit.hardcoded_password_string]
severity = "HIGH"

[tool.bandit.hardcoded_password_funcarg]
severity = "HIGH"
